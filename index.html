<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Stichting L.E.S. at HefHouse. Instagram, TikTok, Facebook, website, and WhatsApp.">
  <title>Stichting L.E.S.</title>
  <style>
    :root {
      --ink: #14343b;
      --muted: #5c7278;
      --teal: #1c5c68;
      --line: rgba(20, 52, 59, 0.08);
      --card: #ffffff;
      --bg: #eef3f2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.4;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      border-radius: 50%;
      pointer-events: none;
    }

    body::before {
      width: 34rem;
      height: 34rem;
      left: -12rem;
      top: -10rem;
      background: radial-gradient(circle, rgba(176, 208, 206, 0.85), transparent 68%);
    }

    body::after {
      width: 40rem;
      height: 40rem;
      right: -16rem;
      bottom: -16rem;
      background: radial-gradient(circle, rgba(214, 224, 214, 0.95), transparent 70%);
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 26.5rem);
      margin: 0 auto;
      padding: 3rem 1.25rem 3.5rem;
      text-align: center;
    }

    .logo {
      width: 9.5rem;
      height: 9.5rem;
      margin: 0 auto 1.35rem;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(16, 48, 54, 0.16);
    }

    .logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.05);
    }

    h1 {
      margin: 0;
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .place {
      margin: 0.3rem 0 1.85rem;
      color: var(--muted);
      font-size: 1rem;
    }

    .links {
      display: grid;
      gap: 0.8rem;
    }

    .link {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 0.85rem;
      min-height: 4rem;
      padding: 0.55rem 0.95rem 0.55rem 0.55rem;
      border-radius: 999px;
      background: var(--card);
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(20, 52, 59, 0.06);
      border: 1px solid var(--line);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .link:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(20, 52, 59, 0.1);
    }

    .link:focus-visible {
      outline: 3px solid #7eb0b6;
      outline-offset: 3px;
    }

    .icon {
      width: 2.75rem;
      height: 2.75rem;
      display: grid;
      place-items: center;
    }

    .icon svg { width: 2.75rem; height: 2.75rem; display: block; }

    .site-mark {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      object-fit: cover;
      transform: scale(1.05);
      display: block;
    }

    .label {
      text-align: left;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .chevron {
      color: #9aabac;
      display: grid;
      place-items: center;
    }

    .chevron svg { width: 1.15rem; height: 1.15rem; display: block; }

    .contact {
      margin: 1.75rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .contact a {
      color: var(--teal);
      font-weight: 600;
      text-decoration: none;
    }

    .contact a:hover { text-decoration: underline; }

    .contact a:focus-visible {
      outline: 3px solid #7eb0b6;
      outline-offset: 3px;
      border-radius: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
    }
  </style>
</head>
